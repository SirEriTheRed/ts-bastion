name: Bug Report
description: Report a reproducible bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please search existing issues first to avoid duplicates.
        Provide a clear description and steps to reproduce.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of the bug.
      placeholder: Describe the bug in detail.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Run command '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
      placeholder: Describe the expected behavior.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened.
      placeholder: Describe the actual behavior.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node, npm and OS version.
      placeholder: "Node 20.x / npm 10.x / Ubuntu 22.04"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Add logs, error messages or screenshots if helpful.
      placeholder: Paste logs or drag screenshots here.
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - critical
        - high
        - medium
        - low
      default: 2
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      description: Please confirm the following.
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: This is a regression (worked in a previous version)
          required: false
