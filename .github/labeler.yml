# Path-based PR labels, applied by .github/workflows/pr-labeler.yml.
# Labels must exist in the repo (kept in sync by .github/labels.yml).

documentation:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '*.md']

github-actions:
  - changed-files:
      - any-glob-to-any-file: '.github/workflows/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file: ['package.json', 'package-lock.json']
