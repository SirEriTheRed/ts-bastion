name: Release

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml # zizmor: ignore[self-hosted-runner]
    permissions:
      contents: write
      security-events: write

  release:
    name: Release
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run sbom:all
      - name: Generate build provenance (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/**
            reports/sbom/*.json
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Detect next release version (dry-run)
        id: sr
        run: |
          set +e
          npx semantic-release --dry-run > sr.log 2>&1
          STATUS=$?
          set -e
          cat sr.log
          if [ "$STATUS" -ne 0 ]; then
            echo "semantic-release failed (exit $STATUS)"
            exit "$STATUS"
          fi
          VERSION=$(grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' sr.log |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          if [ -z "$VERSION" ]; then
            echo "No releasable changes - nothing to do."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish release on its own branch
        if: steps.sr.outputs.version != ''
        run: |
          BRANCH="release/v$VERSION"
          git checkout -B "$BRANCH"
          git push -u origin "$BRANCH"
          # GitHub ignores workflow-level overrides of the default GITHUB_* variables,
          # so env-ci would otherwise resolve ciBranch to the triggering branch (main)
          # and semantic-release would exit without releasing. Set it in the shell,
          # which is not subject to that restriction.
          export GITHUB_REF="refs/heads/$BRANCH"
          npx semantic-release --branches "$BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.sr.outputs.version }}
      - name: Report release PR link or enable auto-merge
        if: steps.sr.outputs.version != ''
        run: |
          BRANCH="release/v$VERSION"
          if gh pr view "$BRANCH" --json url --jq .url >/dev/null 2>&1; then
            echo "PR for $BRANCH already exists - enabling auto-merge."
            gh pr merge --auto --merge "$BRANCH"
          else
            # The workflow must not open the PR itself: a PR created with
            # GITHUB_TOKEN triggers no pull_request workflows (GitHub recursion
            # prevention), so its required checks would never report. A PR
            # opened by a human does trigger them. Print a one-click link.
            URL="https://github.com/$GITHUB_REPOSITORY/compare/main...$BRANCH?expand=1"
            NOTES=$(awk '/^#[#]? [0-9]+\.[0-9]+\.[0-9]+ /{p=1} p' sr.log | head -n 200)
            if [ -z "$NOTES" ]; then
              NOTES="Automated release of v$VERSION."
            fi
            {
              echo "## Release v$VERSION"
              echo ""
              echo "**One click needed:** [Open the release pull request]($URL),"
              echo "then enable auto-merge (or merge once all checks are green)."
              echo ""
              echo "### Release notes"
              echo ""
              echo "$NOTES"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Open the release PR for v$VERSION::$URL"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.sr.outputs.version }}
      - name: Trigger CodeQL for the release branch
        if: steps.sr.outputs.version != ''
        run: |
          # Analyze the release branch up front: workflow_dispatch is exempt
          # from the recursion ban, so SARIF already exists on the head SHA by
          # the time a human opens the PR and the ruleset's code_scanning rule
          # evaluates it. The PR's own pull_request CodeQL run is a harmless
          # duplicate.
          BRANCH="release/v$VERSION"
          gh workflow run codeql.yml --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.sr.outputs.version }}
