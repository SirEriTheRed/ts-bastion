name: Release

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml # zizmor: ignore[self-hosted-runner]
    permissions:
      contents: write
      security-events: write

  release:
    name: Release
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run sbom:all
      - name: Generate build provenance (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/**
            reports/sbom/*.json
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run semantic-release (commit+tag locally, no push)
        id: sr
        run: |
          npx semantic-release --dry-run > sr.log 2>&1
          cat sr.log
          VERSION=$(grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' sr.log | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$VERSION" ]; then
            echo "Failed to extract version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Push release branch & open PR with auto-merge
        if: steps.sr.outputs.version != ''
        run: |
          VERSION="${{ steps.sr.outputs.version }}"
          BRANCH="release/v$VERSION"
          git checkout -B "$BRANCH"
          if ! git diff --quiet -- package-lock.json 2>/dev/null; then
            git add package-lock.json
            git commit -m "chore: update package-lock for $VERSION" --no-verify || true
          fi
          git push origin "$BRANCH" --follow-tags --force-with-lease
          NOTES=$(awk '/---/ {p=1; next} p' sr.log | head -n 200)
          if gh pr view "$BRANCH" --json url --jq .url >/dev/null 2>&1; then
            echo "PR for $BRANCH already exists"
          else
            gh pr create --base main --head "$BRANCH" --title "chore(release): $VERSION" --body "$NOTES" || echo "gh pr create failed, branch pushed"
          fi
          gh pr merge --auto --merge "$BRANCH" || echo "auto-merge pending checks"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
