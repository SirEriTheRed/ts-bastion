name: Release

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml # zizmor: ignore[self-hosted-runner]
    permissions:
      contents: write
      security-events: write

  release:
    name: Release
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run sbom:all
      - name: Generate build provenance (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/**
            reports/sbom/*.json
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Detect next release version (dry-run)
        id: sr
        run: |
          set +e
          npx semantic-release --dry-run > sr.log 2>&1
          STATUS=$?
          set -e
          cat sr.log
          if [ "$STATUS" -ne 0 ]; then
            echo "semantic-release failed (exit $STATUS)"
            exit "$STATUS"
          fi
          VERSION=$(grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' sr.log |
            grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          if [ -z "$VERSION" ]; then
            echo "No releasable changes - nothing to do."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish release on its own branch
        if: steps.sr.outputs.version != ''
        run: |
          BRANCH="release/v$VERSION"
          git checkout -B "$BRANCH"
          git push -u origin "$BRANCH"
          # GitHub ignores workflow-level overrides of the default GITHUB_* variables,
          # so env-ci would otherwise resolve ciBranch to the triggering branch (main)
          # and semantic-release would exit without releasing. Set it in the shell,
          # which is not subject to that restriction.
          export GITHUB_REF="refs/heads/$BRANCH"
          npx semantic-release --branches "$BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.sr.outputs.version }}
      - name: Generate GitHub App token for the release PR
        id: release-pr-token
        # A PR opened with GITHUB_TOKEN triggers no pull_request workflows
        # (GitHub recursion prevention), so the required checks never report.
        # Falls back to GITHUB_TOKEN until the App is configured.
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open release PR and enable auto-merge
        if: steps.sr.outputs.version != ''
        run: |
          BRANCH="release/v$VERSION"
          NOTES=$(awk '/^#[#]? [0-9]+\.[0-9]+\.[0-9]+ /{p=1} p' sr.log | head -n 200)
          if [ -z "$NOTES" ]; then
            NOTES="Automated release of v$VERSION."
          fi
          if gh pr view "$BRANCH" --json url --jq .url >/dev/null 2>&1; then
            echo "PR for $BRANCH already exists"
          else
            gh pr create --base main --head "$BRANCH" --title "chore(release): $VERSION" --body "$NOTES"
          fi
          gh pr merge --auto --merge "$BRANCH"
        env:
          GH_TOKEN: ${{ steps.release-pr-token.outputs.token || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.sr.outputs.version }}
      - name: Trigger CodeQL for the release branch
        if: steps.sr.outputs.version != ''
        run: |
          # Safety net: when the release PR is opened with GITHUB_TOKEN (App not
          # configured), pull_request workflows never start and the ruleset's
          # code_scanning rule would wait forever. workflow_dispatch is exempt
          # from the recursion ban, so analyze the release branch explicitly;
          # SARIF results attach to the PR head commit. With the App configured,
          # the PR's own pull_request run already covers this and the dispatch
          # only creates a harmless duplicate.
          BRANCH="release/v$VERSION"
          gh workflow run codeql.yml --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.sr.outputs.version }}
