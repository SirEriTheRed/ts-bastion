# Source of truth for GitHub labels. Synced by .github/workflows/sync-labels.yml.
- name: accessibility
  color: f143ab
  description: Barrier affecting people with disabilities
- name: bug
  color: d73a4a
  description: Something isn't working
- name: dependencies
  color: 0366d6
  description: Pull requests that update a dependency file
- name: documentation
  color: 0075ca
  description: Improvements or additions to documentation
- name: duplicate
  color: cfd3d7
  description: This issue or pull request already exists
- name: enhancement
  color: a2eeef
  description: New feature or request
- name: github-actions
  color: 000000
  description: Pull requests that update GitHub Actions workflows
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: help wanted
  color: 008672
  description: Extra attention is needed
- name: invalid
  color: e4e669
  description: This doesn't seem right
- name: question
  color: d876e3
  description: Further information is requested
- name: released
  color: ededed
- name: task
  color: 5319e7
  description: Development tracking task
- name: wontfix
  color: ffffff
  description: This will not be worked on
