version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
    groups:
      # Must come before `github-actions`: first matching group wins.
      # codeql-action sub-actions (init/autobuild/analyze/upload-sarif) are
      # separate Dependabot dependencies but must stay on the same version
      # inside a workflow job, so they are bumped together (majors included).
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
