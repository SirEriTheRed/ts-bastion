# osv-scanner suppressions — https://google.github.io/osv-scanner/configuration/
#
# Auto-applied: this file sits next to package-lock.json, so it applies to that
# lockfile (per-directory discovery — it does NOT propagate to child directories).
#
# Every entry is an advisory on a DEV-ONLY package; the production tree is empty
# (`npm audit --omit=dev` is clean), so none of them reach runtime consumers.
#
# Entries are keyed by vulnerability ID rather than by package, so a NEW advisory
# in any of these packages still fails the local `npm run osv` scan and shows up
# in SARIF and must be triaged deliberately. The CI osv step itself is
# non-blocking (`continue-on-error`) so a single finding never gates a merge;
# the prod/critical `npm audit` steps in the Audit job remain blocking.
# Delete an entry once its package is no longer flagged — osv-scanner prints
# "unused ignores" for stale entries, and TODO.md tracks pending upstream fixes.
#
# Why these cannot be fixed here:
#   * braces, http-cache-semantics — advisory range covers every published
#     release (FIXED VERSION = "--"); no fixed version exists upstream.
#     (No longer flagged as of npm 11.21.1's bundled tree — entries removed.)
#   * brace-expansion, ip-address, postcss-selector-parser, glob, minimatch,
#     undici — a fix exists upstream, but the flagged copy is the one bundled
#     inside node_modules/npm (`inBundle: true`); a root `overrides` entry or
#     `npm update <pkg>` cannot reach a bundled subtree. For glob/minimatch the
#     fix is also a semver-major jump of dev tooling. (brace-expansion and
#     postcss-selector-parser are no longer flagged — entries removed.)
#   * katex — fix exists only in 0.18.2, but micromark-extension-math@3.1.0
#     (latest) pins katex ^0.16.0 and @eslint/markdown@8.0.3 is current.
#     Upgrade path: an npm `overrides` entry once the parent widens its range.

