version = 1

[[annotations]]
path = "docs/**"
SPDX-FileCopyrightText = "2026 ts-bastion contributors"
SPDX-License-Identifier = "MIT"

# CHANGELOG.md is generated by @semantic-release/changelog, which prepends
# releases by matching `changelogTitle` at the start of the file, so the
# SPDX header must live here instead of inline.
[[annotations]]
path = "CHANGELOG.md"
SPDX-FileCopyrightText = "2026 ts-bastion contributors"
SPDX-FileContributor = "EriTheRed aka Azelann Borde <azelann.borde@gmail.com>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [
  ".editorconfig",
  ".gitattributes",
  ".gitignore",
  ".ls-lint.yml",
  ".npmrc",
  ".nvmrc",
  ".prettierignore",
  "package-lock.json",
]
SPDX-FileCopyrightText = "2026 ts-bastion contributors"
SPDX-License-Identifier = "MIT"
